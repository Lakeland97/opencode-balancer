name: Release

on:
  push:
    branches:
      - main
  # A release is worth asking for directly. Every push already runs this, but
  # pushing a commit to get a release is a strange way to ask, and an empty
  # commit to re-cut one leaves a line in the history that says nothing.
  #
  # `publish` is the one thing a dispatch can decide, and it is off unless asked
  # for. This repo is a public fork and the package name is the upstream author's
  # scope on npm, so a release here means a tag and a GitHub release; uploading
  # to someone else's namespace is not something a push should ever decide.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version to npm (leave off for a fork-only release)
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript
        run: bun run checktypes

      - name: Run lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Detect release changesets
        id: release_changesets
        run: bun scripts/release/has-changesets.ts

      - name: Version packages
        if: steps.release_changesets.outputs.has_changesets == 'true'
        run: bun run version

      - name: Commit release version
        if: steps.release_changesets.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .changeset CHANGELOG.md package.json bun.lock
            git commit -m "chore: release package"
          fi

      - name: Read package metadata
        id: package_metadata
        run: bun scripts/release/package-metadata.ts

      - name: Build package
        run: bun run build

      - name: Verify built package artifacts
        run: bun test test/tui/dist-artifact.test.ts

      - name: Check npm package
        id: npm_package
        env:
          PACKAGE_NAME: ${{ steps.package_metadata.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package_metadata.outputs.version }}
        run: bun scripts/release/check-npm-published.ts

      - name: Publish npm
        # Off on every push, and off on a dispatch that does not ask: this forks
        # publishes under a name that is not ours yet, so an upload is a
        # deliberate act, taken once the scope question is settled and the run is
        # started with `publish` on.
        if: steps.npm_package.outputs.is_published == 'false' && inputs.publish == true
        run: npm publish --access public

      - name: Ensure git tag
        env:
          RELEASE_TAG: ${{ steps.package_metadata.outputs.tag }}
        run: bun scripts/release/ensure-tag.ts

      - name: Prepare release notes
        env:
          PACKAGE_VERSION: ${{ steps.package_metadata.outputs.version }}
        run: bun scripts/release/write-release-notes.ts

      - name: Push release commit and tags
        env:
          RELEASE_TAG: ${{ steps.package_metadata.outputs.tag }}
        run: bun scripts/release/push-release-refs.ts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package_metadata.outputs.tag }}
        run: bun scripts/release/create-github-release.ts
